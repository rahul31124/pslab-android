name: Build

on:
  pull_request:
    branches: ["flutter"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_EMULATOR_API: 34
  ANDROID_EMULATOR_ARCH: x86_64
  IPHONE_DEVICE_MODEL: iPhone 16 Pro Max
  IPAD_DEVICE_MODEL: iPad Pro 13-inch (M4)

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      is_code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**.md'
              - '!docs/**'
              - '!**.png'
              - '!**.jpg'
              - '!**.jpeg'
              - '!**.gif'
              - '!**.svg'
              - '!**.webp'
              - '!**.txt'
              - '!**.arb'

  common:
    name: Common Build
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: Common Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/common

      - name: Save PR number
        if: needs.changes.outputs.is_code == 'true'
        run: |
          mkdir -p ./pr
          echo ${{ github.event.number }} > ./pr/NR

      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.is_code == 'true'
        with:
          name: pr
          path: pr/

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing common tasks."

  android:
    name: Android Flutter Build
    needs: [changes, common]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: Android Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/android

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing Android build."

  ios:
    name: iOS Flutter Build
    needs: [changes, common]
    runs-on: ${{ needs.changes.outputs.is_code == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Set up Xcode
        if: needs.changes.outputs.is_code == 'true'
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.4.0'
          
      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: iOS Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/ios

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing iOS build."

  screenshots-android:
    name: Screenshots (Android)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: Android Screenshot Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/screenshot-android
        with:
          ANDROID_EMULATOR_API: ${{ env.ANDROID_EMULATOR_API }}
          ANDROID_EMULATOR_ARCH: ${{ env.ANDROID_EMULATOR_ARCH }}

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing Android screenshots."

  screenshots-iphone:
    name: Screenshots (iPhone)
    needs: changes
    runs-on: ${{ needs.changes.outputs.is_code == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Set up Xcode
        if: needs.changes.outputs.is_code == 'true'
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.4.0'

      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: iPhone Screenshot Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/screenshot-iphone
        with:
          IPHONE_DEVICE_MODEL: ${{ env.IPHONE_DEVICE_MODEL }}

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing iPhone screenshots."

  screenshots-ipad:
    name: Screenshots (iPad)
    needs: changes
    runs-on: ${{ needs.changes.outputs.is_code == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Set up Xcode
        if: needs.changes.outputs.is_code == 'true'
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.4.0'

      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: iPad Screenshot Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/screenshot-ipad
        with:
          IPAD_DEVICE_MODEL: ${{ env.IPAD_DEVICE_MODEL }}

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing iPad screenshots."

  windows:
    name: Windows Flutter Build
    needs: [changes, common]
    runs-on: ${{ needs.changes.outputs.is_code == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: Windows Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/windows

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing Windows build."

  linux:
    name: Linux Flutter Build
    needs: [changes, common]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: Linux Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/linux

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing Linux build."

  linux-arm64:
    name: Linux ARM64 Flutter Build
    needs: [changes, common]
    runs-on: ${{ needs.changes.outputs.is_code == 'true' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: Linux ARM64 Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/linux-arm64

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing Linux ARM64 build."

  macos:
    name: macOS Flutter Build
    needs: [changes, common]
    runs-on: ${{ needs.changes.outputs.is_code == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Set up Xcode
        if: needs.changes.outputs.is_code == 'true'
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '16.4.0'

      - uses: actions/checkout@v4
        if: needs.changes.outputs.is_code == 'true'

      - name: macOS Workflow
        if: needs.changes.outputs.is_code == 'true'
        uses: ./.github/actions/macos 

      - name: Docs Only Bypass
        if: needs.changes.outputs.is_code != 'true'
        run: echo "Docs-only change detected. Bypassing macOS build."
