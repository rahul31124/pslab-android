name: Docs Bypass

on:
  pull_request:
    branches: ["flutter"]
    paths:
      - '**.md'
      - 'docs/**'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '**.webp'
      - '**.txt'
      - '**.arb'

jobs:

  check:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if git diff --name-only origin/${{ github.base_ref }} | grep -vE '\.(md|png|jpg|jpeg|gif|svg|webp|txt|arb)$'; then
            echo "docs_only=false" >> $GITHUB_OUTPUT
          else
            echo "docs_only=true" >> $GITHUB_OUTPUT
          fi

  android:
    name: Android Flutter Build
    needs: check
    if: needs.check.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change"

  ios:
    name: iOS Flutter Build
    needs: check
    if: needs.check.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change"
